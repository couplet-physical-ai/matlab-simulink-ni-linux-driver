name: Offline simulation tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline Python unit and boundary tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Synthetic-only smoke report
        run: python tools/ci_smoke.py
      - name: Build synthetic UDP runtime and run C model tests (no NI libraries)
        run: make -C runtime all test
      - name: Check no NI driver/output pathway was exported
        run: |
          test ! -e runtime/src/hal_daqmx.c
          test ! -e stand-kit
          test ! -e docker/ni-daqmx
          ! grep -ER 'DAQmxWrite|DAQmxCreateAO|DAQmxCreateDO|libnidaqmx' runtime/src runtime/Makefile
