# Roadrunner CI (Woodpecker + Dagger, https://cicd.apps.example.com): port of .github/workflows/ci.yml (Offline simulation tests) — Python 3.12 stdlib unittest + synthetic smoke report, the synthetic UDP C runtime + C model tests (make -C runtime all test, no NI libraries), and the no-NI-output-pathway export check.
# `$$` escapes `$` for Woodpecker. Docs: https://cicd.docs.example.com/roadrunner/
labels:
  tier: "0"
when:
  - event: pull_request
  - event: [push, manual]
    branch: main
steps:
  - name: offline
    image: bash
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-plain --src=. --repo="$${CI_REPO_NAME,,}" --python=3.12 --apt=make,gcc,libc6-dev
        --run='python -m unittest discover -s tests -v && python tools/ci_smoke.py && make -C runtime all test &&
        test ! -e runtime/src/hal_daqmx.c && test ! -e stand-kit && test ! -e docker/ni-daqmx &&
        if grep -ER "DAQmxWrite|DAQmxCreateAO|DAQmxCreateDO|libnidaqmx" runtime/src runtime/Makefile; then echo "NI driver/output pathway exported" >&2; exit 1; fi'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
